<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />

  <title>JatLog</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#1F7A4C" />

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="JatLog" />
  <link rel="apple-touch-icon" href="./icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icon-512.png" />
  <link rel="icon" type="image/png" href="./icon-192.png" />

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #F2F4EF;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* iOSのセーフエリア（ノッチ/ホームバー）を避ける */
    #frame-wrap {
      position: fixed;
      top: env(safe-area-inset-top, 0px);
      left: env(safe-area-inset-left, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    /* 読み込み中のスプラッシュ */
    #splash {
      position: fixed;
      inset: 0;
      background: #F2F4EF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      z-index: 10;
      transition: opacity .4s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    #splash.hidden { opacity: 0; pointer-events: none; }

    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 22px;
    }

    #splash p {
      margin: 0;
      color: #566B5E;
      font-weight: 600;
      font-size: 11px;
      letter-spacing: .16em;
      text-transform: uppercase;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid rgba(31, 122, 76, .18);
      border-top-color: #1F7A4C;
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* アクティベーション画面（この端末で一度だけ） */
    #gate {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      overflow-y: auto;
      padding: calc(env(safe-area-inset-top, 0px) + 32px) 20px 32px;
      background: #F2F4EF;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #12261C;
    }

    #gate.show { display: block; }

    .gate-inner {
      max-width: 420px;
      margin: 0 auto;
    }

    #gate img {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      display: block;
    }

    .gate-mark {
      margin: 18px 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: #1F7A4C;
      font-weight: 600;
    }

    #gate h1 {
      font-size: 26px;
      font-weight: 700;
      margin: 8px 0 6px;
      line-height: 1.22;
      letter-spacing: -.02em;
    }

    #gate .sub {
      margin: 0 0 22px;
      font-size: 14px;
      line-height: 1.55;
      color: #566B5E;
    }

    .gate-card {
      background: #FFFFFF;
      border: 1px solid #DCE4DC;
      border-radius: 16px;
      padding: 18px 16px;
      box-shadow: 0 1px 2px rgba(18, 38, 28, .05), 0 6px 20px rgba(18, 38, 28, .05);
    }

    .gate-card label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: #566B5E;
      margin-bottom: 8px;
    }

    #gate input {
      width: 100%;
      font-size: 16px;
      padding: 12px 14px;
      border: 1.5px solid #DCE4DC;
      border-radius: 12px;
      background: #FFFFFF;
      color: #12261C;
      font-family: inherit;
    }

    #gate input:focus {
      outline: none;
      border-color: #1F7A4C;
      box-shadow: 0 0 0 4px #E4F1E9;
    }

    #gate button {
      width: 100%;
      margin-top: 14px;
      padding: 13px 16px;
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      color: #FFFFFF;
      background: #1F7A4C;
      border: 1px solid #1F7A4C;
      border-radius: 12px;
      cursor: pointer;
    }

    #gate button:active { background: #16593A; }

    #gate .warn {
      display: none;
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 13.5px;
      line-height: 1.5;
      background: #F9E6E4;
      border: 1px solid #E9BDB9;
      color: #A6231C;
    }

    #gate .warn.show { display: block; }

    .gate-foot {
      margin-top: 26px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 10px;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: #9AA99F;
    }
  </style>
</head>
<body>

  <div id="splash">
    <img src="./icon-192.png" alt="" />
    <div class="spinner"></div>
    <p>Carregando</p>
  </div>

  <div id="gate">
    <div class="gate-inner">
      <img src="./icon-192.png" alt="" />
      <p class="gate-mark">JatLog</p>
      <h1>Ativar o aparelho</h1>
      <p class="sub">Digite o código de activação que o gestor lhe deu.
        Só é preciso uma vez neste aparelho.</p>

      <div class="gate-card">
        <div class="warn" id="gate-warn"></div>
        <label for="gate-code">Código de activação</label>
        <input type="text" id="gate-code" autocomplete="off" autocapitalize="off"
               autocorrect="off" spellcheck="false" enterkeyhint="go" />
        <button type="button" id="gate-go">Ativar</button>
      </div>

      <div class="gate-foot">Registro de colheita</div>
    </div>
  </div>

  <div id="frame-wrap">
    <iframe
      id="app"
      allow="clipboard-read; clipboard-write"
      referrerpolicy="no-referrer-when-downgrade"></iframe>
  </div>

  <script>
    var APP_ORIGIN = 'https://line-wise26-27-5t5bh4e67t3xjvevkazpru.streamlit.app';
    var APP_URL    = APP_ORIGIN + '/?embed=true';
    var STORE_KEY  = 'jatlog_activation_code';

    var splash = document.getElementById('splash');
    var gate   = document.getElementById('gate');
    var warn   = document.getElementById('gate-warn');
    var frame  = document.getElementById('app');

    // localStorage はプライベートモードなどで例外を投げることがある
    function readCode() {
      try { return localStorage.getItem(STORE_KEY) || ''; } catch (e) { return ''; }
    }
    function saveCode(v) {
      try { localStorage.setItem(STORE_KEY, v); } catch (e) {}
    }

    function hideSplash() {
      splash.classList.add('hidden');
      setTimeout(function () { splash.style.display = 'none'; }, 500);
    }

    // コードを付けてアプリ本体を読み込む
    function boot(code) {
      gate.classList.remove('show');
      splash.style.display = '';
      splash.classList.remove('hidden');
      frame.src = APP_URL + '&ac=' + encodeURIComponent(code);
      // Streamlitは初期描画に少し時間がかかるので余裕を持たせる
      frame.addEventListener('load', function () {
        setTimeout(hideSplash, 1200);
      }, { once: true });
      // 保険：一定時間で必ず消す
      setTimeout(hideSplash, 12000);
    }

    function showGate() {
      splash.style.display = 'none';
      gate.classList.add('show');
      setTimeout(function () { document.getElementById('gate-code').focus(); }, 200);
    }

    function activate() {
      var v = document.getElementById('gate-code').value.trim();
      if (!v) {
        warn.textContent = 'Digite o código de activação.';
        warn.classList.add('show');
        return;
      }
      warn.classList.remove('show');
      saveCode(v);
      boot(v);
    }

    document.getElementById('gate-go').addEventListener('click', activate);
    document.getElementById('gate-code').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') activate();
    });

    // アプリ本体で正しいコードを入れ直した場合、その値を覚え直す
    // （ラッパーはコードの正解を知らないので、判定は必ずアプリ側が行う）
    window.addEventListener('message', function (e) {
      if (e.origin !== APP_ORIGIN) return;
      var d = e.data;
      if (d && d.type === 'jatlog-activation' && d.code) saveCode(String(d.code));
    });

    var saved = readCode();
    if (saved) { boot(saved); } else { showGate(); }

    // Service Worker（Chromeでのインストール要件）
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js', { scope: './' })
          .catch(function (e) { console.warn('SW registration failed:', e); });
      });
    }

    // ピンチズームを抑止してアプリらしい挙動にする
    document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  </script>

</body>
</html>
